<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>Rock, Paper, Scissors</h1>
        </div>
    </header>
    <main>
        <section class="btns">
            <div class="container">
                <button id="btn-rock" class="btn-btn-rock">rock</button>
                <button id="btn-paper" class="btn-btn-paper">paper</button>
                <button id="btn-scissors" class="btn-btn-scissors">scissors</button>
            </div>
        </section>
        <section class="info">
            <div class="container">
                <p>Round: <span>2</span></p>
                <p>Result: <span>Message Result Round</span></p>
                <article>
                    <p>Human Score: <span>3</span></p>
                    <p>Computer Score: <span>2</span></p>
                </article>
            </div>
        </section>
    </main>
    <script src="script.js" defer></script>
</body>

</html>
