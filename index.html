<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>Rock, Paper, Scissors</h1>
        </div>
    </header>
    <main>
        <section class="btns">
            <button id="btn-rock" class="btn btn-rock" value="rock">Rock</button>
            <button id="btn-paper" class="btn btn-paper" value="paper">Paper</button>
            <button id="btn-scissors" class="btn btn-scissors" value="scissors">Scissors</button>
        </section>
        <section class="info">
            <article class="container-score">
                <div>
                    <p>Human</p>
                    <span class="human-choice">-</span>
                </div>
                <div>
                    <p>Computer</p>
                    <span class="computer-choice">-</span>
                </div>
            </article>
            <div class="info-result">
                <p>Round Result</p>
                <span class="round-result">-</span>
            </div>
            <article class="container-score">
                <div>
                    <p>Human<br>Score</p>
                    <span class="human-score">-</span>
                </div>
                <div>
                    <p>Computer<br>Score</p>
                    <span class="computer-score">-</span>
                </div>
            </article>
            <div class="info-result">
                <p>Match Result</p>
                <span class="match-result">-</span>
            </div>
            <div>
                <button class="btn btn-reset">Nueva Partida</button>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="container">
            <p>Created by <span><a href="#">Gustavo Miño</a></span></p>
        </div>
    </footer>
    <script src="script.js" defer></script>
</body>

</html>
