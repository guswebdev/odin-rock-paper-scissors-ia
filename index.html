<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>Rock, Paper, Scissors</h1>
        </div>
    </header>
    <main>
        <section class="btns">
            <button id="btn-rock" class="btn btn-rock">rock</button>
            <button id="btn-paper" class="btn btn-paper">paper</button>
            <button id="btn-scissors" class="btn btn-scissors">scissors</button>
        </section>
        <section class="info">
            <div class="info-round">
                <p>Round</p>
                <span>0</span>
            </div>
            <div class="info-result">
                <p>Result</p>
                <span>Message Result Round</span>
            </div>
            <article class="container-score">
                <div>
                    <p>Human<br>Score</p>
                    <span>0</span>
                </div>
                <div>
                    <p>Computer<br>Score</p>
                    <span>0</span>
                </div>
            </article>
        </section>
    </main>
    <footer class="footer">
        <div class="container">
            <p>Created by <span><a href="#">Gustavo Miño</a></span></p>
        </div>
    </footer>
    <script src="script.js" defer></script>
</body>

</html>
